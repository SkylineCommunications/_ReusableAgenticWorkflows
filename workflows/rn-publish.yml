name: Release Note Publisher

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  push-release-note:
    if: |
      github.event.label.name == 'rn-publish' &&
      github.event.pull_request.head.repo.owner.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Parse release note comment and publish to collaboration
        env:
          GH_TOKEN: ${{ github.token }}
          COLLABORATION_USERNAME: ${{ secrets.COLLABORATION_USERNAME }}
          COLLABORATION_PASSWORD: ${{ secrets.COLLABORATION_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SOLUTION_NAME: ${{ vars.SOLUTION_NAME }}
        run: |
          set -euo pipefail

          # If the SOLUTION_NAME variable is configured, use it and include Application/Functionality in the payload.
          # If the variable does not exist (GitHub does not allow empty-valued variables), push without them.
          if [ -n "$SOLUTION_NAME" ]; then
            SOLUTION="$SOLUTION_NAME"
          else
            SOLUTION=""
          fi

          if [ -z "$COLLABORATION_USERNAME" ] || [ -z "$COLLABORATION_PASSWORD" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Missing required secrets: \`COLLABORATION_USERNAME\` and/or \`COLLABORATION_PASSWORD\` are not configured in this repository."
            exit 1
          fi

          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq '.title')

          if [ -z "$PR_TITLE" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Could not retrieve the PR title. The PR must have a title before the release note can be published."
            exit 1
          fi

          PR_URL="https://github.com/${REPO}/pull/${PR_NUMBER}"

          # Resolve the base branch and latest release tag for SolutionVersion (silently omitted if none found)
          BASE_BRANCH=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName --jq '.baseRefName')
          SOLUTION_VERSION=$(gh api "repos/$REPO/releases" \
            --jq '[.[] | select(.target_commitish == "'"$BASE_BRANCH"'" and .draft == false)] | first | .tag_name // empty' \
            2>/dev/null || true)
          if [ -n "$SOLUTION_VERSION" ]; then HAS_VERSION=true; else HAS_VERSION=false; fi

          # Fetch all release note draft comments (id + body)
          RN_COMMENTS_JSON=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | test("## 📋 Release Note")) | {id: .id, body: .body}]')
          RN_COUNT=$(printf '%s' "$RN_COMMENTS_JSON" | jq 'length')

          if [ "$RN_COUNT" -eq 0 ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ No release note draft found. Run the summarizer first (it triggers automatically on PR merge)."
            exit 1
          fi

          # Authenticate with Skyline API once for all entries
          TOKEN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.skyline.be/Token" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=${COLLABORATION_USERNAME}" \
            --data-urlencode "password=${COLLABORATION_PASSWORD}")
          TOKEN_HTTP=$(printf '%s' "$TOKEN_RESPONSE" | tail -1)
          TOKEN_BODY=$(printf '%s' "$TOKEN_RESPONSE" | head -n -1)
          ACCESS_TOKEN=$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token')

          if [ "$TOKEN_HTTP" != "200" ] || [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            ERROR_MSG=$(printf '%s' "$TOKEN_BODY" | jq -r '.error_description // .error // .Message // .' 2>/dev/null || printf '%s' "$TOKEN_BODY")
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Failed to authenticate with Skyline API (HTTP $TOKEN_HTTP). Check \`COLLABORATION_USERNAME\` and \`COLLABORATION_PASSWORD\` secrets. Response: \`$ERROR_MSG\`"
            exit 1
          fi

          if [ -n "$SOLUTION" ]; then HAS_SOLUTION=true; else HAS_SOLUTION=false; fi

          ERRORS=0

          for i in $(seq 0 $((RN_COUNT - 1))); do
            COMMENT_ID=$(printf '%s' "$RN_COMMENTS_JSON" | jq -r ".[$i].id")
            COMMENT_BODY=$(printf '%s' "$RN_COMMENTS_JSON" | jq -r ".[$i].body")
            ENTRY_NUM=$((i + 1))

            TITLE=$(printf '%s\n' "$COMMENT_BODY" \
              | sed -n 's/^\*\*Title:\*\*[[:space:]]*//p' \
              | head -n 1 | tr -d '\r' | xargs)
            # Fall back to PR title for comments that predate the Title field
            if [ -z "$TITLE" ]; then
              TITLE="$PR_TITLE"
            fi
            TYPE=$(printf '%s\n' "$COMMENT_BODY" \
              | sed -n 's/^\*\*Type:\*\*[[:space:]]*//p' \
              | head -n 1 | tr -d '\r' | xargs)
            BREAKING=$(printf '%s\n' "$COMMENT_BODY" \
              | sed -n 's/^\*\*Breaking Change:\*\*[[:space:]]*//p' \
              | head -n 1 | tr -d '\r' | xargs)

            if [ -z "$TYPE" ]; then
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                -f body="❌ Release note #${ENTRY_NUM}: could not find \`**Type:**\`. Please edit the comment and set it to one of: \`New Feature/Enhancement\`, \`Bug Fix\`, \`Release Notes\`."
              ERRORS=$((ERRORS + 1))
              continue
            fi
            if ! printf '%s' "$TYPE" | grep -qE "^(New Feature/Enhancement|Bug Fix|Release Notes)$"; then
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                -f body="❌ Release note #${ENTRY_NUM}: invalid Type \`$TYPE\`. Must be one of: \`New Feature/Enhancement\`, \`Bug Fix\`, \`Release Notes\`."
              ERRORS=$((ERRORS + 1))
              continue
            fi

            if [ -z "$BREAKING" ]; then
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                -f body="❌ Release note #${ENTRY_NUM}: could not find \`**Breaking Change:**\`. Please edit the comment and set it to \`true\` or \`false\`."
              ERRORS=$((ERRORS + 1))
              continue
            fi
            if [ "$BREAKING" != "true" ] && [ "$BREAKING" != "false" ]; then
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                -f body="❌ Release note #${ENTRY_NUM}: invalid Breaking Change value \`$BREAKING\`. Must be \`true\` or \`false\`."
              ERRORS=$((ERRORS + 1))
              continue
            fi

            DESCRIPTION=$(printf '%s\n' "$COMMENT_BODY" \
              | awk '
                  /^## .*Release Note/ { in_rn=1; next }
                  !in_rn { next }
                  /^\*\*Title:\*\*/ { next }
                  /^\*\*Type:\*\*/ { next }
                  /^\*\*Breaking/ { next }
                  /^---$/ { next }
                  /^<!--/ { next }
                  /^> / { next }
                  /^✅/ { next }
                  /^[[:space:]]*$/ { if (!started) next; print; next }
                  { started=1; print }
                ' \
              | head -c 4000 \
              | pandoc -f gfm -t html --wrap=none)
            echo "::debug::Converted description HTML: $DESCRIPTION"

            if [ -z "$DESCRIPTION" ]; then
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                -f body="❌ Release note #${ENTRY_NUM}: could not extract a description."
              ERRORS=$((ERRORS + 1))
              continue
            fi

            if [ "$BREAKING" = "true" ]; then BREAKING_JSON=true; else BREAKING_JSON=false; fi

            PAYLOAD=$(jq -n \
              --arg title "$TITLE" \
              --arg desc "$DESCRIPTION" \
              --arg type "$TYPE" \
              --argjson breaking "$BREAKING_JSON" \
              --arg solution "$SOLUTION" \
              --argjson has_solution "$HAS_SOLUTION" \
              --arg version "$SOLUTION_VERSION" \
              --argjson has_version "$HAS_VERSION" \
              --arg pr_url "$PR_URL" \
              '{Title: $title, Description: $desc, Type: $type, BreakingChange: $breaking, InternalComments: $pr_url}
               + (if $has_solution then {Application: "Solutions", Functionality: [$solution]} else {} end)
               + (if $has_version then {SolutionVersion: $version} else {} end)')

            # Check for idempotency marker — if already published, update instead of creating a new entry
            EXISTING_RN_ID=$(printf '%s' "$COMMENT_BODY" \
              | sed -n 's/.*<!-- rn-published: \([0-9]*\) -->.*/\1/p' | head -1 | tr -d '\r' || true)

            if [ -n "$EXISTING_RN_ID" ]; then
              PATCH_PAYLOAD=$(printf '%s' "$PAYLOAD" | jq --argjson id "$EXISTING_RN_ID" '. + {ID: $id}')
              RN_RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH "https://api.skyline.be/api/ReleaseNotes" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PATCH_PAYLOAD")
              RN_HTTP=$(printf '%s' "$RN_RESPONSE" | tail -1)
              RESPONSE=$(printf '%s' "$RN_RESPONSE" | head -n -1)
              if [ "$RN_HTTP" != "200" ] && [ "$RN_HTTP" != "201" ]; then
                gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                  -f body="❌ Release note #${ENTRY_NUM}: Skyline API update failed (HTTP $RN_HTTP): $(printf '%s' "$RESPONSE" | jq -r '.Message // .')"
                ERRORS=$((ERRORS + 1))
              fi
              # Comment already contains the published URL — no edit needed
            else
              RN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.skyline.be/api/ReleaseNotes" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              RN_HTTP=$(printf '%s' "$RN_RESPONSE" | tail -1)
              RESPONSE=$(printf '%s' "$RN_RESPONSE" | head -n -1)
              RN_ID=$(printf '%s' "$RESPONSE" | jq -r '.ID // empty')
              if { [ "$RN_HTTP" != "200" ] && [ "$RN_HTTP" != "201" ]; } || [ -z "$RN_ID" ]; then
                gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                  -f body="❌ Release note #${ENTRY_NUM}: Skyline API call failed (HTTP $RN_HTTP): $(printf '%s' "$RESPONSE" | jq -r '.Message // .')"
                ERRORS=$((ERRORS + 1))
                continue
              fi

              # Append the published URL and idempotency marker to the original RN comment in-place
              NEW_BODY=$(printf '%s\n\n✅ Published: https://collaboration.dataminer.services/releasenotes/%s\n<!-- rn-published: %s -->' \
                "$COMMENT_BODY" "$RN_ID" "$RN_ID")
              gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -f body="$NEW_BODY"
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi

      - name: Update labels
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Remove workflow labels regardless of outcome
          gh api "repos/$REPO/issues/$PR_NUMBER/labels/rn-publish" -X DELETE 2>/dev/null || true
          gh api "repos/$REPO/issues/$PR_NUMBER/labels/rn-proposal" -X DELETE 2>/dev/null || true
          # Add rn-published label only on success
          if [ "${{ job.status }}" = "success" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/labels" -f labels[]="rn-published" 2>/dev/null || true
            gh api "repos/$REPO/issues/$PR_NUMBER/labels/rn-draft" -X DELETE 2>/dev/null || true
          fi