name: Release Note Publisher

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  push-release-note:
    if: github.event.label.name == 'rn-publish'
    runs-on: ubuntu-latest
    steps:
      - name: Parse release note comment and publish to collaboration
        env:
          GH_TOKEN: ${{ github.token }}
          COLLABORATION_USERNAME: ${{ secrets.COLLABORATION_USERNAME }}
          COLLABORATION_PASSWORD: ${{ secrets.COLLABORATION_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SOLUTION_NAME: ${{ vars.SOLUTION_NAME }}
        run: |
          set -euo pipefail

          # If the SOLUTION_NAME variable is configured, use it and include Application/Functionality in the payload.
          # If the variable does not exist (GitHub does not allow empty-valued variables), push without them.
          if [ -n "$SOLUTION_NAME" ]; then
            SOLUTION="$SOLUTION_NAME"
          else
            SOLUTION=""
          fi

          if [ -z "$COLLABORATION_USERNAME" ] || [ -z "$COLLABORATION_PASSWORD" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Missing required secrets: \`COLLABORATION_USERNAME\` and/or \`COLLABORATION_PASSWORD\` are not configured in this repository."
            exit 1
          fi

          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq '.title')

          if [ -z "$PR_TITLE" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Could not retrieve the PR title. The PR must have a title before the release note can be published."
            exit 1
          fi

          # Find the RN draft comment by marker
          RN_COMMENT=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | test("## 📋 Release Note"))] | last | .body')

          if [ -z "$RN_COMMENT" ] || [ "$RN_COMMENT" = "null" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ No release note draft found. Run the summarizer first (it triggers automatically on PR merge)."
            exit 1
          fi

          TYPE=$(printf '%s\n' "$RN_COMMENT" \
            | sed -n 's/^\*\*Type:\*\*[[:space:]]*//p' \
            | head -n 1 | xargs)
          BREAKING=$(printf '%s\n' "$RN_COMMENT" \
            | sed -n 's/^\*\*Breaking Change:\*\*[[:space:]]*//p' \
            | head -n 1 | xargs)

          if [ -z "$TYPE" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Could not find \`**Type:**\` in the release note draft. Please edit the comment and set it to one of: \`New Feature/Enhancement\`, \`Bug Fix\`, \`Release Notes\`."
            exit 1
          fi
          if ! printf '%s' "$TYPE" | grep -qE "^(New Feature/Enhancement|Bug Fix|Release Notes)$"; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Invalid Type \`$TYPE\` in the release note draft. Must be one of: \`New Feature/Enhancement\`, \`Bug Fix\`, \`Release Notes\`."
            exit 1
          fi

          if [ -z "$BREAKING" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Could not find \`**Breaking Change:**\` in the release note draft. Please edit the comment and set it to \`true\` or \`false\`."
            exit 1
          fi
          if [ "$BREAKING" != "true" ] && [ "$BREAKING" != "false" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Invalid Breaking Change value \`$BREAKING\` in the release note draft. Must be \`true\` or \`false\`."
            exit 1
          fi

          DESCRIPTION=$(printf '%s\n' "$RN_COMMENT" \
            | awk '
                /^## .*Release Note/ { in_rn=1; next }
                !in_rn { next }
                /^\*\*Type:\*\*/ { next }
                /^\*\*Breaking/ { next }
                /^---$/ { next }
                /^<!--/ { next }
                /^> / { next }
                /^[[:space:]]*$/ { next }
                { print }
              ' \
            | head -c 4000)

          if [ -z "$DESCRIPTION" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Could not extract a description from the release note draft."
            exit 1
          fi

          TOKEN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.skyline.be/Token" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=${COLLABORATION_USERNAME}" \
            --data-urlencode "password=${COLLABORATION_PASSWORD}")
          TOKEN_HTTP=$(echo "$TOKEN_RESPONSE" | tail -1)
          TOKEN_BODY=$(echo "$TOKEN_RESPONSE" | head -n -1)
          ACCESS_TOKEN=$(echo "$TOKEN_BODY" | jq -r '.access_token')

          if [ "$TOKEN_HTTP" != "200" ] || [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            ERROR_MSG=$(echo "$TOKEN_BODY" | jq -r '.error_description // .error // .Message // .' 2>/dev/null || echo "$TOKEN_BODY")
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Failed to authenticate with Skyline API (HTTP $TOKEN_HTTP). Check \`COLLABORATION_USERNAME\` and \`COLLABORATION_PASSWORD\` secrets. Response: \`$ERROR_MSG\`"
            exit 1
          fi

          if [ "$BREAKING" = "true" ]; then BREAKING_JSON=true; else BREAKING_JSON=false; fi
          if [ -n "$SOLUTION" ]; then HAS_SOLUTION=true; else HAS_SOLUTION=false; fi

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg desc "$DESCRIPTION" \
            --arg type "$TYPE" \
            --argjson breaking "$BREAKING_JSON" \
            --arg solution "$SOLUTION" \
            --argjson has_solution "$HAS_SOLUTION" \
            '{Title: $title, Description: $desc, Type: $type, BreakingChange: $breaking}
             + (if $has_solution then {Application: "Solutions", Functionality: [$solution]} else {} end)')

          # Check for a previously published RN — if found, update it instead of creating a duplicate
          EXISTING_SUCCESS=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | test("collaboration.dataminer.services/releasenotes/"))] | last | .body // ""')
          EXISTING_RN_ID=$(echo "$EXISTING_SUCCESS" | grep -oE 'releasenotes/[0-9]+' | grep -oE '[0-9]+' || echo "")

          if [ -n "$EXISTING_RN_ID" ]; then
            PATCH_PAYLOAD=$(echo "$PAYLOAD" | jq --argjson id "$EXISTING_RN_ID" '. + {ID: $id}')
            RN_RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH "https://api.skyline.be/api/ReleaseNotes" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PATCH_PAYLOAD")
            RN_HTTP=$(echo "$RN_RESPONSE" | tail -1)
            RESPONSE=$(echo "$RN_RESPONSE" | head -n -1)
            if [ "$RN_HTTP" != "200" ] && [ "$RN_HTTP" != "201" ]; then
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                -f body="❌ Skyline API call failed while updating release note $EXISTING_RN_ID (HTTP $RN_HTTP): $(echo "$RESPONSE" | jq -r '.Message // .')"
              exit 1
            fi
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="✅ Release note updated on DataMiner Collaboration: https://collaboration.dataminer.services/releasenotes/$EXISTING_RN_ID"
          else
            RN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.skyline.be/api/ReleaseNotes" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            RN_HTTP=$(echo "$RN_RESPONSE" | tail -1)
            RESPONSE=$(echo "$RN_RESPONSE" | head -n -1)
            RN_ID=$(echo "$RESPONSE" | jq -r '.ID // empty')
            if { [ "$RN_HTTP" != "200" ] && [ "$RN_HTTP" != "201" ]; } || [ -z "$RN_ID" ]; then
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                -f body="❌ Skyline API call failed (HTTP $RN_HTTP): $(echo "$RESPONSE" | jq -r '.Message // .')"
              exit 1
            fi
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="✅ Release note pushed to DataMiner Collaboration: https://collaboration.dataminer.services/releasenotes/$RN_ID"
          fi

      - name: Update labels
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Remove workflow labels regardless of outcome
          gh api "repos/$REPO/issues/$PR_NUMBER/labels/rn-publish" -X DELETE 2>/dev/null || true
          gh api "repos/$REPO/issues/$PR_NUMBER/labels/rn-proposal" -X DELETE 2>/dev/null || true
          # Add rn-published label only on success
          if [ "${{ job.status }}" = "success" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/labels" -f labels[]="rn-published" 2>/dev/null || true
            gh api "repos/$REPO/issues/$PR_NUMBER/labels/rn-draft" -X DELETE 2>/dev/null || true
          fi
