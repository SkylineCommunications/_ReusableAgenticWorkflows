name: Release Note Publisher

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  push-release-note:
    if: github.event.label.name == 'rn-publish'
    runs-on: ubuntu-latest
    steps:
      - name: Parse release note comment and publish to collaboration
        env:
          GH_TOKEN: ${{ github.token }}
          COLLABORATION_USERNAME: ${{ secrets.COLLABORATION_USERNAME }}
          COLLABORATION_PASSWORD: ${{ secrets.COLLABORATION_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq '.title')

          # Find the RN draft comment by marker
          RN_COMMENT=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | test("## 📋 Release Note"))] | last | .body')

          if [ -z "$RN_COMMENT" ] || [ "$RN_COMMENT" = "null" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ No release note draft found. Run the summarizer first (it triggers automatically on PR merge)."
            exit 1
          fi

          TYPE=$(printf '%s\n' "$RN_COMMENT" \
            | sed -n 's/^\*\*Type:\*\*[[:space:]]*//p' \
            | head -n 1 | xargs)
          BREAKING=$(printf '%s\n' "$RN_COMMENT" \
            | sed -n 's/^\*\*Breaking Change:\*\*[[:space:]]*//p' \
            | head -n 1 | xargs)

          [ -z "$TYPE" ]     && TYPE="New Feature/Enhancement"
          [ -z "$BREAKING" ] && BREAKING="false"

          DESCRIPTION=$(printf '%s\n' "$RN_COMMENT" \
            | awk '
                /^## .*Release Note/ { in_rn=1; next }
                !in_rn { next }
                /^\*\*Type:\*\*/ { next }
                /^\*\*Breaking/ { next }
                /^---$/ { next }
                /^<!--/ { next }
                /^> / { next }
                /^[[:space:]]*$/ { next }
                { print }
              ' \
            | head -c 4000)

          if [ -z "$DESCRIPTION" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Could not extract a description from the release note draft."
            exit 1
          fi

          TOKEN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.skyline.be/Token" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=${COLLABORATION_USERNAME}" \
            --data-urlencode "password=${COLLABORATION_PASSWORD}")
          TOKEN_HTTP=$(echo "$TOKEN_RESPONSE" | tail -1)
          TOKEN_BODY=$(echo "$TOKEN_RESPONSE" | head -n -1)
          ACCESS_TOKEN=$(echo "$TOKEN_BODY" | jq -r '.access_token')

          if [ "$TOKEN_HTTP" != "200" ] || [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            ERROR_MSG=$(echo "$TOKEN_BODY" | jq -r '.error_description // .error // .Message // .' 2>/dev/null || echo "$TOKEN_BODY")
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Failed to authenticate with Skyline API (HTTP $TOKEN_HTTP). Check \`COLLABORATION_USERNAME\` and \`COLLABORATION_PASSWORD\` secrets. Response: \`$ERROR_MSG\`"
            exit 1
          fi

          if [ "$BREAKING" = "true" ]; then BREAKING_JSON=true; else BREAKING_JSON=false; fi

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg desc "$DESCRIPTION" \
            --arg type "$TYPE" \
            --argjson breaking "$BREAKING_JSON" \
            '{Title: $title, Description: $desc, Type: $type, BreakingChange: $breaking}')

          RN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.skyline.be/api/ReleaseNotes" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          RN_HTTP=$(echo "$RN_RESPONSE" | tail -1)
          RESPONSE=$(echo "$RN_RESPONSE" | head -n -1)

          RN_ID=$(echo "$RESPONSE" | jq -r '.ID // empty')

          if { [ "$RN_HTTP" != "200" ] && [ "$RN_HTTP" != "201" ]; } || [ -z "$RN_ID" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="❌ Skyline API call failed (HTTP $RN_HTTP): $(echo "$RESPONSE" | jq -r '.Message // .')"
            exit 1
          fi

          gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            -f body="✅ Release note pushed to DataMiner Collaboration: https://collaboration.dataminer.services/releasenotes/$RN_ID"

      - name: Update labels
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Remove publish-rn label regardless of outcome
          gh api "repos/$REPO/issues/$PR_NUMBER/labels/publish-rn" -X DELETE 2>/dev/null || true
          # Add rn-published label only on success
          if [ "${{ job.status }}" = "success" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/labels" -f labels[]="rn-published" 2>/dev/null || true
            gh api "repos/$REPO/issues/$PR_NUMBER/labels/rn-draft" -X DELETE 2>/dev/null || true
          fi
