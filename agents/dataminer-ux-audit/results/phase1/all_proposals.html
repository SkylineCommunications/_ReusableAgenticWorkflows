<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facility Manager — All Design Proposals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080b10; color: #f5f7fb; font-family: "Segoe UI", system-ui, sans-serif; }
    body { overflow: hidden; }
    :root {
      --control-bg: rgba(6, 10, 16, 0.96);
      --control-border: rgba(255,255,255,0.1);
      --text-muted: #94a3b8;
      --ease: cubic-bezier(.22,1,.36,1);
    }
    .control-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 88px;
      z-index: 1000;
      background: linear-gradient(180deg, rgba(9,13,20,.98), rgba(7,10,16,.96));
      border-bottom: 1px solid var(--control-border);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
    }
    .control-row {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .control-row:last-child { border-bottom: 0; }
    .control-label {
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 11px;
      min-width: 52px;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      height: 31px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: #9aa6b2;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .01em;
      transition: transform .2s var(--ease), background .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease);
    }
    .tab-btn:hover { transform: translateY(-1px); color: #eef3fb; border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); }
    .tab-btn.active { color: #fff; background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.28); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 6px 22px rgba(0,0,0,0.28); }
    .level-dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 16px currentColor; }

    #viewer {
      position: fixed;
      top: 88px;
      left: 0;
      right: 0;
      bottom: 0;
      min-width: 1440px;
      overflow: auto;
      background: radial-gradient(circle at top, rgba(255,255,255,.05), transparent 35%), #070b11;
    }
    #viewer::-webkit-scrollbar { width: 10px; height: 10px; }
    #viewer::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 999px; }

    .proposal-panel { display: none; min-height: calc(100vh - 88px); }
    .proposal-panel.active { display: block; animation: panelIn .45s var(--ease); }
    @keyframes panelIn { from { opacity: 0; transform: translateY(10px) scale(.995); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .app-shell {
      min-height: calc(100vh - 88px);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }
    .app-header {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      background: var(--header-bg);
      color: var(--header-text);
      border-bottom: 1px solid var(--header-border);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,.03);
      flex-shrink: 0;
    }
    .app-brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      white-space: nowrap;
      color: inherit;
    }
    .crumbs { font-size: 11px; opacity: .85; letter-spacing: .04em; white-space: nowrap; }
    .header-spacer { flex: 1; }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      opacity: .9;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);
    }
    .live-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52,211,153,.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52,211,153,.45); }
      70% { box-shadow: 0 0 0 7px rgba(52,211,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }
    .header-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      background: var(--avatar-bg);
      color: var(--avatar-text);
    }

    .app-body { flex: 1; display: flex; min-height: 0; }
    .left-nav {
      width: var(--nav-width);
      flex-shrink: 0;
      background: var(--nav-bg);
      border-right: 1px solid var(--nav-border);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-item {
      min-height: 38px;
      border-radius: 10px;
      color: var(--nav-text);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      position: relative;
      border: 1px solid transparent;
      transition: all .2s var(--ease);
      overflow: hidden;
    }
    .nav-item .icon { width: 18px; text-align: center; flex-shrink: 0; opacity: .95; }
    .nav-item .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 600; }
    .nav-item.active { background: var(--nav-active-bg); color: var(--nav-active-text); border-color: var(--nav-active-border); box-shadow: var(--nav-active-shadow); }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      bottom: 7px;
      width: 3px;
      border-radius: 0 999px 999px 0;
      background: var(--accent);
    }
    .nav-item.icon-only { justify-content: center; padding: 0; }
    .nav-item.icon-only .label { display: none; }
    .nav-spacer { flex: 1; }

    .page-scroll { flex: 1; min-width: 0; overflow: auto; background: var(--bg); }
    .page-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
    .page-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 999px; }
    .page-wrap { padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .page-title-row { display: flex; align-items: center; gap: 12px; }
    .page-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--title);
      letter-spacing: .01em;
    }
    .page-kicker { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .14em; }
    .mono { font-family: "JetBrains Mono", monospace; }
    .raj { font-family: "Rajdhani", sans-serif; }

    .card, .metric-card, .table-card, .sub-card, .filter-panel, .sidebar-card, .canvas-panel, .map-card, .action-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--section-title);
      font-weight: 800;
    }
    .section-chip {
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      padding: 3px 8px;
      white-space: nowrap;
    }

    .metric-grid { display: grid; gap: 14px; }
    .metric-grid.cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .metric-grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .metric-grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .metric-card { padding: 16px; position: relative; overflow: hidden; }
    .metric-card::after {
      content: "";
      position: absolute;
      inset: auto -20% -55% auto;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255,255,255,.12), transparent 60%);
      pointer-events: none;
      opacity: .45;
    }
    .metric-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 12px; }
    .metric-value { font-size: 38px; font-weight: 800; line-height: 1; color: var(--metric); }
    .metric-sub { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .metric-strip { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; margin-top: 12px; }
    .metric-fill { height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width 1.2s var(--ease); }
    .metric-inline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge.status-active { background: #4ade80; color: #0d1b12; }
    .badge.status-deprecated { background: #f5a42a; color: #221402; }
    .badge.type-building { background: rgba(148,163,184,.18); color: #d7dee8; border: 1px solid rgba(148,163,184,.22); }
    .badge.ghost { background: rgba(255,255,255,.06); color: var(--muted); border: 1px solid var(--border-soft); }

    .overview-layout { display: grid; grid-template-columns: minmax(0,1fr) 260px; gap: 16px; align-items: start; }
    .overview-main { display: flex; flex-direction: column; gap: 14px; }
    .overview-sidebar { display: flex; flex-direction: column; gap: 10px; }
    .sidebar-card { padding: 14px; }
    .filter-input, .text-input {
      width: 100%;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text);
      padding: 0 12px;
      outline: none;
      font-size: 12px;
    }
    .sidebar-stat {
      border-left: 3px solid var(--accent);
      padding: 10px 12px 10px 14px;
      background: var(--stat-bg);
      border-radius: 0 10px 10px 0;
    }
    .sidebar-stat .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .sidebar-stat .value { font-size: 24px; font-weight: 800; color: var(--sidebar-metric); }

    .chart-card, .table-card, .sub-card, .map-card, .canvas-panel, .filter-panel { padding: 16px; }
    .chart-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .chart-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }

    .solid-pie-wrap, .donut-wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 170px; }
    .solid-pie {
      width: 138px;
      height: 138px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.15), transparent 34%), var(--solid);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 20px 40px rgba(0,0,0,.22);
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.92);
      font-weight: 900;
      font-size: 26px;
    }
    .legend-stack { display: flex; flex-direction: column; gap: 10px; }
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-row span:last-child { color: var(--muted); }

    .donut-svg { width: 138px; height: 138px; transform: rotate(-90deg); }
    .donut-track { fill: none; stroke: var(--track); stroke-width: 12; }
    .donut-seg { fill: none; stroke-width: 12; stroke-linecap: round; stroke-dasharray: 0 999; transition: stroke-dasharray 1.35s var(--ease); }
    .donut-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-size: 26px;
      font-weight: 900;
      color: var(--metric);
    }
    .donut-holder { position: relative; width: 138px; height: 138px; }

    .bar-v-wrap { height: 176px; display: flex; align-items: end; gap: 14px; padding: 6px 0 22px; position: relative; }
    .bar-v-wrap::before, .bar-v-wrap::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255,255,255,.08);
    }
    .bar-v-wrap::before { top: 40px; }
    .bar-v-wrap::after { top: 96px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
    .bar-v {
      width: 100%;
      max-width: 82px;
      height: 0;
      border-radius: 10px 10px 0 0;
      background: linear-gradient(180deg, rgba(255,255,255,.16), transparent 18%), var(--bar);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
      transition: height 1.2s var(--ease);
    }
    .bar-name { font-size: 11px; color: var(--muted); width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-value { font-size: 11px; color: var(--text); font-weight: 700; }

    .h-bars { display: flex; flex-direction: column; gap: 12px; }
    .h-row { display: grid; grid-template-columns: 90px minmax(0,1fr) 62px; gap: 10px; align-items: center; }
    .h-label { font-size: 11px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .h-track { height: 18px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .h-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--bar) 78%, white 8%), var(--bar));
      transition: width 1.2s var(--ease);
    }
    .h-value { font-size: 11px; font-weight: 800; color: var(--metric); }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 800;
      padding: 0 10px 10px 10px;
      white-space: nowrap;
    }
    td {
      padding: 12px 10px;
      font-size: 12px;
      color: var(--text);
      border-top: 1px solid var(--row-border);
      vertical-align: middle;
    }
    .table-card tbody tr:nth-child(even) td { background: var(--row-alt); }
    .table-card tbody tr:hover td { background: var(--row-hover); }
    .table-wrap { overflow: auto; }
    .cell-stack { display: flex; flex-direction: column; gap: 5px; }
    .cell-sub { font-size: 11px; color: var(--muted); }
    .sort-icon { margin-left: 6px; opacity: .5; }
    .usage-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(148,163,184,.15);
      color: var(--metric);
      font-weight: 800;
      font-size: 11px;
    }
    .usage-bar { height: 7px; background: var(--track); border-radius: 999px; overflow: hidden; min-width: 84px; }
    .usage-bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 75%, white 15%)); transition: width 1.15s var(--ease); }

    .content-split { display: grid; grid-template-columns: 220px minmax(0,1fr) 360px; gap: 16px; align-items: start; }
    .main-stack, .right-stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .filter-panel { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 18px; }
    .panel-search, .panel-toolbar { display: flex; align-items: center; gap: 8px; }
    .filter-chip, .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .filter-section { border-top: 1px solid var(--border-soft); padding-top: 12px; }
    .filter-name { font-size: 12px; font-weight: 800; color: var(--section-title); margin-bottom: 8px; }
    .check-list { display: flex; flex-direction: column; gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); }
    .check-box { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border-soft); background: var(--surface-2); }
    .sub-card { padding-top: 0; overflow: hidden; }
    .sub-card-header {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--sub-header-bg);
      color: var(--sub-header-text);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .03em;
    }
    .sub-card-body { padding: 14px; }
    .border-top-card .sub-card-header { background: transparent; color: var(--text); border-bottom: 0; border-top: 3px solid var(--accent); }
    .table-compact td { padding-top: 10px; padding-bottom: 10px; }
    .skeleton-row { height: 18px; border-radius: 999px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent), var(--surface-2); background-size: 220px 100%, 100% 100%; animation: shimmer 1.6s linear infinite; margin-bottom: 10px; }
    @keyframes shimmer { from { background-position: -220px 0, 0 0; } to { background-position: 220px 0, 0 0; } }

    .map-card { padding: 14px; }
    .map-toolbar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      margin-bottom: 12px;
    }
    .map-canvas {
      height: 292px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      background: var(--map-water);
      border: 1px solid var(--border-soft);
    }
    .map-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: .45;
    }
    .land {
      position: absolute;
      background: var(--map-land);
      filter: drop-shadow(0 16px 30px rgba(0,0,0,.2));
    }
    .land.e1 { width: 180px; height: 90px; left: 260px; top: 74px; border-radius: 55% 45% 48% 52% / 52% 44% 56% 48%; transform: rotate(8deg); }
    .land.e2 { width: 90px; height: 64px; left: 340px; top: 146px; border-radius: 58% 42% 50% 50% / 58% 42% 58% 42%; }
    .land.e3 { width: 74px; height: 34px; left: 220px; top: 106px; border-radius: 55% 45% 40% 60% / 50% 50% 50% 50%; }
    .land.e4 { width: 100px; height: 52px; left: 455px; top: 154px; border-radius: 55% 45% 58% 42% / 50% 50% 50% 50%; }
    .marker {
      position: absolute;
      left: 318px;
      top: 118px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #fff;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), transparent 38%), var(--accent);
      box-shadow: 0 16px 40px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 0 6px rgba(255,255,255,.06);
    }
    .marker::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      transform: translateY(34px);
      filter: blur(5px);
    }

    .rooms-layout { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 16px; }
    .bottom-panels { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }

    .racks-layout { display: grid; grid-template-columns: 240px minmax(0,1fr); gap: 16px; }
    .range-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .designer-wrap { display: grid; grid-template-columns: minmax(0,1fr) 260px; gap: 16px; min-height: 640px; }
    .action-bar {
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .action-btn {
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--action-border);
      background: var(--action-bg);
      color: var(--action-text);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .03em;
    }
    .canvas-panel {
      position: relative;
      min-height: 580px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--canvas-bg);
    }
    .canvas-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--canvas-overlay);
      pointer-events: none;
    }
    .canvas-note {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 18px;

      ['E&_Rack001', 'Active', 'Standard', 40, 9, 22.5, '⚡5']
    ];

    const designerRooms = ['Demo Room', 'Room001', 'bm-mich-f1-r105', 'bm-mich-f1-r106', 'f-kley-f1-r101', 'f-kley-f1-r102', 'f-kley-f1-r103', 'f-kley-f2-r200', 'f-kley-f2-r203'];

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function statusBadge(value) {
      const cls = value === 'Deprecated' ? 'status-deprecated' : 'status-active';
      return `<span class="badge ${cls}">${escapeHtml(value)}</span>`;
    }

    function navHtml(page, level) {
      const iconOnly = level === 'l1' && page === 'overview';
      return `
        <aside class="left-nav">
          ${pages.map(item => `
            <div class="nav-item ${item.key === page ? 'active' : ''} ${iconOnly ? 'icon-only' : ''}">
              <span class="icon">${item.icon}</span>
              <span class="label">${item.label}</span>
            </div>
          `).join('')}
          <div class="nav-spacer"></div>
          <div class="nav-item ${iconOnly ? 'icon-only' : ''}">
            <span class="icon">⚙</span>
            <span class="label">Settings</span>
          </div>
        </aside>`;
    }

    function headerHtml(page, level) {
      const pageLabel = pages.find(p => p.key === page).label;
      const crumb = level === 'l1' ? '' : `<div class="crumbs">Facility Manager · ${pageLabel}${level === 'l2' ? ' · Proposal' : level === 'l3' ? ' · Visual System' : ' · Reimagined Flow'}</div>`;
      const meta = level === 'l4'
        ? `<div class="live-pill"><span class="dot"></span><span>Live Facility Pulse</span></div>`
        : level === 'l3'
        ? `<div class="live-pill"><span class="dot"></span><span>Operations sync</span></div>`
        : `<span>${level === 'l2' ? 'Breadcrumb navigation' : 'WCAG AA contrast pass'}</span>`;
      return `
        <header class="app-header">
          <div class="app-brand">Facility Manager</div>
          ${crumb}
          <div class="header-spacer"></div>
          <div class="header-meta">${meta}</div>
          <div class="header-avatar">FM</div>
        </header>`;
    }

    function shell(page, level, content) {
      return `
        <section class="proposal-panel" id="${page}-${level}">
          <div class="app-shell">
            ${headerHtml(page, level)}
            <div class="app-body">
              ${navHtml(page, level)}
              <div class="page-scroll">
                ${content}
              </div>
            </div>
          </div>
        </section>`;
    }

    function verticalBars(card) {
      return `
        <div class="chart-card stagger" style="--delay:0">
          <div class="section-head">
            <div class="section-title">${escapeHtml(card.title)}</div>
            <div class="section-chip">original ranking</div>
          </div>
          <div class="bar-v-wrap">
            ${card.items.map((item, index) => {
              const pct = Math.max(8, (item.value / card.max) * 100);
              return `
                <div class="bar-col">
                  <div class="bar-v vertical-anim" style="--bar:${card.color}" data-height="${pct}%"></div>
                  <div class="bar-value">${item.value}${card.suffix}</div>
                  <div class="bar-name">${escapeHtml(item.name)}</div>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    function horizontalBars(card) {
      return `
        <div class="chart-card stagger">
          <div class="section-head">
            <div class="section-title">${escapeHtml(card.title)}</div>
            <div class="section-chip">cleaner comparison</div>
          </div>
          <div class="h-bars">
            ${card.items.map((item, index) => {
              const pct = (item.value / card.max) * 100;
              return `
                <div class="h-row">
                  <div class="h-label">${escapeHtml(item.name)}</div>
                  <div class="h-track"><div class="h-fill width-anim" style="--bar:${card.color}" data-width="${pct}%"></div></div>
                  <div class="h-value">${item.value}${card.suffix}</div>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    function solidPie(pie) {
      return `
        <div class="chart-card stagger">
          <div class="section-head">
            <div class="section-title">${escapeHtml(pie.title)}</div>
            <div class="section-chip">faithful solid circle</div>
          </div>
          <div class="solid-pie-wrap">
            <div class="solid-pie" style="--solid:${pie.color}">${pie.percent}%</div>
            <div class="legend-stack">
              <div class="legend-row"><span class="legend-dot" style="background:${pie.color}"></span><strong>${escapeHtml(pie.label)}</strong> <span>${pie.percent}%</span></div>
            </div>
          </div>
        </div>`;
    }

    function donutCard(pie, chipText) {
      const circumference = 314;
      return `
        <div class="chart-card stagger">
          <div class="section-head">
            <div class="section-title">${escapeHtml(pie.title)}</div>
            <div class="section-chip">${chipText}</div>
          </div>
          <div class="donut-wrap">
            <div class="donut-holder">
              <svg class="donut-svg" viewBox="0 0 120 120">
                <circle class="donut-track" cx="60" cy="60" r="50"></circle>
                <circle class="donut-seg" cx="60" cy="60" r="50" stroke="${pie.color}" data-circ="${circumference}" data-percent="${pie.percent}"></circle>
              </svg>
              <div class="donut-center"><span class="countup" data-count="${pie.percent}" data-suffix="%">0%</span></div>
            </div>
            <div class="legend-stack">
              <div class="legend-row"><span class="legend-dot" style="background:${pie.color}"></span><strong>${escapeHtml(pie.label)}</strong><span>100% of facilities</span></div>
              <div class="legend-row"><span class="legend-dot" style="background:rgba(255,255,255,.1)"></span><span>Other</span><span>0%</span></div>
            </div>
          </div>
        </div>`;
    }

    function overviewSidebar(level) {

    function filterPanel(titleRows, level, compact = false) {
      return `
        <aside class="filter-panel stagger">

    function basicTable(headers, rows, options = {}) {

                <tr>${headers.map(h => `<th>${h}${options.sort ? '<span class="sort-icon">↕</span>' : ''}</th>`).join('')}</tr>
              </thead>
              <tbody>
                ${rows.map(row => `<tr>${row.map((cell, idx) => `<td>${cell}</td>`).join('')}</tr>`).join('')}

        `${row[5]}%`,
        `<div class="cell-stack"><div>${row[6]}%</div><div class="usage-bar"><span class="width-anim" data-width="${row[6]}%"></span></div></div>`
      ]);

    function renderRooms(level) {

              <div class="bottom-panels">

                ${facilitiesSubCard(level, 'Rows 📋', basicTable(['Name', 'State', 'Room Name'], rowsPanelRows.map(r => [r[0], statusBadge(r[1]), r[2]]), { compact: true }), '')}

      switch (page) {

    function buildTabs() {
      document.getElementById('pageTabs').innerHTML = pages.map(page => `<button class="tab-btn page-tab" data-page="${page.key}" onclick="show('${page.key}', currentLevel)">${page.label}</button>`).join('');
      document.getElementById('levelTabs').innerHTML = levels.map(level => `<button class="tab-btn level-tab" data-level="${level.key}" onclick="show(currentPage, '${level.key}')"><span class="level-dot" style="background:${level.dot}; color:${level.dot}"></span>${level.key.toUpperCase()} ${level.label}</button>`).join('');
    }

    function buildPanels() {
      const viewer = document.getElementById('viewer');
      viewer.innerHTML = pages.map(page => levels.map(level => renderPanel(page.key, level.key)).join('')).join('');
    }

    let currentPage = 'overview';
    let currentLevel = 'l1';

    function animatePanel(panel) {
      if (!panel) return;
      panel.classList.remove('animate');
      panel.querySelectorAll('.stagger').forEach((el, index) => {
        el.style.transitionDelay = `${index * 80}ms`;
      });

      panel.querySelectorAll('.countup').forEach(el => {
        el.textContent = '0' + (el.dataset.suffix || '');
      });
      panel.querySelectorAll('.width-anim').forEach(el => { el.style.width = '0'; });
      panel.querySelectorAll('.vertical-anim').forEach(el => { el.style.height = '0'; el.style.background = `linear-gradient(180deg, rgba(255,255,255,.16), transparent 18%), ${el.style.getPropertyValue('--bar') || getComputedStyle(el).getPropertyValue('--bar') || 'var(--bar)'}`; });
      panel.querySelectorAll('.donut-seg').forEach(seg => {
        const circ = Number(seg.dataset.circ || 314);
        seg.style.strokeDasharray = `0 ${circ}`;
      });

      requestAnimationFrame(() => {
        panel.classList.add('animate');
        panel.querySelectorAll('.countup').forEach((el, index) => animateCount(el, index * 80));
        panel.querySelectorAll('.width-anim').forEach((el, index) => setTimeout(() => { el.style.width = el.dataset.width; }, index * 80));
        panel.querySelectorAll('.usage-bar > span').forEach((el, index) => setTimeout(() => { el.style.width = el.dataset.width; }, index * 80));
        panel.querySelectorAll('.vertical-anim').forEach((el, index) => setTimeout(() => { el.style.height = el.dataset.height; }, index * 80));
        panel.querySelectorAll('.donut-seg').forEach((seg, index) => {
          const circ = Number(seg.dataset.circ || 314);
          const percent = Number(seg.dataset.percent || 0);
          setTimeout(() => {
            seg.style.strokeDasharray = `${(percent / 100) * circ} ${circ}`;
          }, index * 80);
        });
      });
    }

    function animateCount(el, delay) {
      const target = Number(el.dataset.count || 0);
      const decimals = Number(el.dataset.decimals || (String(target).includes('.') ? String(target).split('.')[1].length : 0));
      const prefix = el.dataset.prefix || '';
      const suffix = el.dataset.suffix || '';
      const duration = 1000;
      setTimeout(() => {
        const start = performance.now();
        function frame(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          const value = target * eased;
          el.textContent = `${prefix}${value.toFixed(decimals)}${suffix}`;
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }, delay);
    }

    function show(page, level) {
      currentPage = page;
      currentLevel = level;
      document.querySelectorAll('.proposal-panel').forEach(panel => panel.classList.remove('active'));
      document.querySelectorAll('.page-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.page === page));
      document.querySelectorAll('.level-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.level === level));
      const panel = document.getElementById(`${page}-${level}`);
      if (panel) {
        panel.classList.add('active');
        document.getElementById('viewer').scrollTop = 0;
        animatePanel(panel);
      }
    }

    buildTabs();
    buildPanels();
    show('overview', 'l1');
    window.show = show;
  </script>
</body>
</html>
