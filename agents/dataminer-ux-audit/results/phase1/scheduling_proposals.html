<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduling — Design Proposal Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080b10; color: #e8eef7; font-family: "Rajdhani", sans-serif; }
    body { overflow: hidden; }
    :root {
      --control-bg: #0A0A0A;
      --control-border: rgba(255,255,255,0.1);
      --text-muted: #94a3b8;
      --ease: cubic-bezier(.22,1,.36,1);
      --mono: "JetBrains Mono", monospace;
      --display: "Rajdhani", sans-serif;
      --secondary-blue: #60A5FA;
      --secondary-orange: #FB923C;
      --secondary-gold: #F59E0B;
    }
    .mono { font-family: var(--mono); }
    .control-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 88px;
      z-index: 1000;
      background: var(--control-bg);
      border-bottom: 1px solid var(--control-border);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
    }
    .control-row {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .control-row:last-child { border-bottom: 0; }
    .control-label {
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 11px;
      min-width: 52px;
      white-space: nowrap;
    }
    .control-label.app-label {
      min-width: auto;
      text-transform: none;
      letter-spacing: .08em;
      font-size: 12px;
      color: #9ca3af;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      height: 31px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: #9aa6b2;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--display);
      letter-spacing: .01em;
      transition: transform .2s var(--ease), background .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease);
    }
    .tab-btn:hover { transform: translateY(-1px); color: #eef3fb; border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); }
    .tab-btn.active { color: #fff; background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.28); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 6px 22px rgba(0,0,0,0.28); }
    .level-dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 16px currentColor; }

    #viewer {
      position: fixed;
      top: 88px;
      left: 0;
      right: 0;
      bottom: 0;
      min-width: 1480px;
      overflow: auto;
      background: radial-gradient(circle at top, rgba(255,255,255,.05), transparent 35%), #070b11;
    }
    #viewer::-webkit-scrollbar,
    .page-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
    #viewer::-webkit-scrollbar-thumb,
    .page-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 999px; }

    .proposal-panel { display: none; min-height: calc(100vh - 88px); }
    .proposal-panel.active { display: block; animation: panelIn .45s var(--ease); }
    @keyframes panelIn { from { opacity: 0; transform: translateY(10px) scale(.995); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .proposal-panel[data-level="l1"] {
      --bg: #1A2230;
      --surface: #1f2a39;
      --surface-2: #223245;
      --border: rgba(123,165,175,.2);
      --border-soft: rgba(123,165,175,.12);
      --header-bg: #1E2D3D;
      --header-text: #c7d1dc;
      --header-border: rgba(77,182,172,.16);
      --nav-bg: #1A2030;
      --nav-border: rgba(255,255,255,.05);
      --nav-text: #8ea3b7;
      --nav-active-bg: rgba(0,230,118,.12);
      --nav-active-text: #f6fffb;
      --nav-active-border: rgba(0,230,118,.22);
      --text: #dfe8f1;
      --muted: #8aa1b4;
      --title: #00E676;
      --accent: #2fd3a6;
      --accent-soft: rgba(47,211,166,.14);
      --accent-strong: #74f5ca;
      --section-title: #b8ccdb;
      --track: rgba(255,255,255,.08);
      --row-border: rgba(255,255,255,.08);
      --row-alt: rgba(255,255,255,.02);
      --shadow: 0 14px 28px rgba(0,0,0,.2);
      --radius: 10px;
      --label-rail-bg: rgba(255,255,255,.94);
      --label-rail-text: #132331;
      --ops-edge: #2dd4bf;
      --state-draft: #9C27B0;
      --state-tentative: #FFD600;
      --state-confirmed: #4CAF50;
      --state-running: #00E676;
      --state-completed: #2196F3;
      --state-error: #F44336;
    }
    .proposal-panel[data-level="l2"] {
      --bg: #17212A;
      --surface: #20303B;
      --surface-2: #253846;
      --border: rgba(102,191,184,.16);
      --border-soft: rgba(102,191,184,.12);
      --header-bg: #223544;
      --header-text: #d3e0eb;
      --header-border: rgba(60,215,173,.18);
      --nav-bg: #18202C;
      --nav-border: rgba(255,255,255,.05);
      --nav-text: #9ab2c4;
      --nav-active-bg: rgba(45,212,191,.12);
      --nav-active-text: #f2fffc;
      --nav-active-border: rgba(45,212,191,.22);
      --text: #e5edf5;
      --muted: #9bb2c1;
      --title: #00E676;
      --accent: #2dd4bf;
      --accent-soft: rgba(45,212,191,.14);
      --accent-strong: #7af1e1;
      --section-title: #d9edf0;
      --track: rgba(255,255,255,.09);
      --row-border: rgba(255,255,255,.08);
      --row-alt: rgba(255,255,255,.025);
      --shadow: 0 18px 32px rgba(0,0,0,.22);
      --radius: 12px;
      --label-rail-bg: rgba(246,252,252,.95);
      --label-rail-text: #102430;
      --ops-edge: #2dd4bf;
      --state-draft: #9C27B0;
      --state-tentative: #FFD600;
      --state-confirmed: #4CAF50;
      --state-running: #00E676;
      --state-completed: #2196F3;
      --state-error: #F44336;
    }
    .proposal-panel[data-level="l3"] {
      --bg: #0D1520;
      --surface: #0F1C28;
      --surface-2: #0b1621;
      --border: rgba(104,144,180,.24);
      --border-soft: rgba(104,144,180,.16);
      --header-bg: #0A1018;
      --header-text: #e6edf6;
      --header-border: rgba(245,164,42,.42);
      --nav-bg: #0A1018;
      --nav-border: rgba(104,144,180,.14);
      --nav-text: #91a7bf;
      --nav-active-bg: rgba(245,164,42,.1);
      --nav-active-text: #edf4fc;
      --nav-active-border: rgba(245,164,42,.22);
      --text: #dbe7f3;
      --muted: #7d97ae;
      --title: #edf4fc;
      --accent: #F5A42A;
      --accent-soft: rgba(245,164,42,.12);
      --accent-strong: #f6b44b;
      --section-title: #b8cadc;
      --track: rgba(125,151,174,.15);
      --row-border: rgba(104,144,180,.18);
      --row-alt: rgba(13,21,32,.35);
      --shadow: 0 20px 44px rgba(0,0,0,.28);
      --radius: 10px;
      --label-rail-bg: #f5f8fc;
      --label-rail-text: #10202f;
      --ops-edge: #2dd4bf;
      --state-draft: #B785FF;
      --state-tentative: #F2C94C;
      --state-confirmed: #4CC870;
      --state-running: #42F59B;
      --state-completed: #55A8FF;
      --state-error: #FF6B6B;
    }
    .proposal-panel[data-level="l4"] {
      --bg: #060B12;
      --surface: #0C1520;
      --surface-2: #0a111a;
      --border: rgba(45,212,191,.2);
      --border-soft: rgba(96,165,250,.14);
      --header-bg: #0A1018;
      --header-text: #e8f6f4;
      --header-border: rgba(45,212,191,.22);
      --nav-bg: #0C1520;
      --nav-border: rgba(45,212,191,.12);
      --nav-text: #8fb3c8;
      --nav-active-bg: rgba(45,212,191,.08);
      --nav-active-text: #e9faf8;
      --nav-active-border: rgba(45,212,191,.28);
      --text: #dbedf1;
      --muted: #7ea1b1;
      --title: #e7fbf8;
      --accent: #2DD4BF;
      --accent-soft: rgba(45,212,191,.14);
      --accent-strong: #8cf5e8;
      --section-title: #b9f2ea;
      --track: rgba(96,165,250,.14);
      --row-border: rgba(45,212,191,.14);
      --row-alt: rgba(12,21,32,.42);
      --shadow: 0 24px 54px rgba(0,0,0,.32);
      --radius: 14px;
      --label-rail-bg: rgba(10,17,26,.88);
      --label-rail-text: #d9eef1;
      --ops-edge: #2dd4bf;
      --state-draft: #C39BFF;
      --state-tentative: #F5C65E;
      --state-confirmed: #54CC82;
      --state-running: #4AF7B2;
      --state-completed: #5AA9FF;
      --state-error: #FF7C7C;
    }

    .app-shell {
      min-height: calc(100vh - 88px);
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top right, rgba(255,255,255,.03), transparent 22%), var(--bg);
      color: var(--text);
    }
    .proposal-panel[data-level="l3"] .app-shell {
      background-image: radial-gradient(circle at top right, rgba(245,164,42,.08), transparent 24%), radial-gradient(circle at bottom left, rgba(96,165,250,.08), transparent 20%);
    }
    .proposal-panel[data-level="l4"] .app-shell {
      background-image: radial-gradient(circle at top right, rgba(45,212,191,.1), transparent 24%), radial-gradient(circle at bottom left, rgba(96,165,250,.1), transparent 20%);
    }
    .app-header {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      background: var(--header-bg);
      color: var(--header-text);
      border-bottom: 1px solid var(--header-border);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,.03);
      flex-shrink: 0;
    }
    .proposal-panel[data-level="l3"] .app-header,
    .proposal-panel[data-level="l4"] .app-header { border-bottom-width: 3px; }
    .app-brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .crumbs { font-size: 12px; opacity: .82; white-space: nowrap; letter-spacing: .03em; }
    .header-spacer { flex: 1; }
    .header-meta { display: flex; align-items: center; gap: 10px; }
    .ghost-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 13px;
      color: inherit;
    }
    .header-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
      color: #fff;
      border: 1px solid rgba(255,255,255,.12);
    }
    .app-body { flex: 1; display: flex; min-height: 0; }
    .left-nav {
      width: 56px;
      flex-shrink: 0;
      background: var(--nav-bg);
      border-right: 1px solid var(--nav-border);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-item {
      height: 38px;
      border-radius: 11px;
      color: var(--nav-text);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid transparent;
      font-size: 15px;
      transition: all .2s var(--ease);
    }
    .nav-item.active {
      background: var(--nav-active-bg);
      color: var(--nav-active-text);
      border-color: var(--nav-active-border);
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
    }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 7px;
      bottom: 7px;
      width: 3px;
      border-radius: 0 999px 999px 0;
      background: var(--accent);
    }
    .nav-spacer { flex: 1; }
    .page-scroll { flex: 1; min-width: 0; overflow: auto; }
    .page-wrap { padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .page-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .page-title { font-size: 34px; font-weight: 700; letter-spacing: .02em; color: var(--title); }
    .page-kicker { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .16em; }
    .proposal-chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .top-metrics { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .metric-card,
    .filter-panel,
    .timeline-card,
    .table-card,
    .sub-card,
    .inline-filter-bar,
    .empty-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .proposal-panel[data-level="l4"] .metric-card,
    .proposal-panel[data-level="l4"] .filter-panel,
    .proposal-panel[data-level="l4"] .timeline-card,
    .proposal-panel[data-level="l4"] .table-card,
    .proposal-panel[data-level="l4"] .sub-card,
    .proposal-panel[data-level="l4"] .inline-filter-bar,
    .proposal-panel[data-level="l4"] .empty-card {
      backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(12,21,32,.92), rgba(10,17,26,.94));
    }
    .metric-card { padding: 16px; position: relative; overflow: hidden; }
    .metric-card::after {
      content: "";
      position: absolute;
      inset: auto -10% -65% auto;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255,255,255,.08), transparent 62%);
      pointer-events: none;
    }
    .metric-label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin-bottom: 10px; }
    .metric-value { font-size: 34px; font-weight: 700; line-height: 1; }
    .proposal-panel[data-level="l3"] .metric-value,
    .proposal-panel[data-level="l4"] .metric-value { font-family: var(--mono); }
    .metric-sub { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 34px; }
    .metric-strip { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; margin-top: 12px; }
    .metric-fill { display: block; width: 0; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 75%, white 10%)); transition: width 1.1s var(--ease); }

    .split-layout { display: grid; grid-template-columns: 280px minmax(0,1fr); gap: 16px; }
    .main-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .filter-panel { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--section-title); font-weight: 700; }
    .section-chip {
      font-size: 12px;
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
    }
    .filter-section { display: flex; flex-direction: column; gap: 10px; }
    .filter-section.l2-collapsible .section-head::after {
      content: "▾";
      color: var(--muted);
      font-size: 12px;
    }
    .input-wrap { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    .input-shell {
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(255,255,255,.03);
      display: flex;
      align-items: center;
      padding: 0 10px 0 12px;
      gap: 8px;
    }
    .proposal-panel[data-level="l1"] .input-shell,
    .proposal-panel[data-level="l2"] .input-shell { background: rgba(255,255,255,.035); }
    .input-shell input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-family: var(--display);
      font-size: 14px;
    }
    .input-shell button,
    .ghost-btn,
    .icon-btn {
      border: 0;
      outline: 0;
      cursor: pointer;
      font-family: inherit;
    }
    .input-shell button,
    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      color: var(--muted);
    }
    .ghost-btn {
      padding: 0 12px;
      height: 34px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      color: var(--text);
      border: 1px solid var(--border-soft);
    }
    .pill-row,
    .pill-group,
    .category-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-pill,
    .category-chip,
    .mini-pill,
    .status-tag {
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
    }
    .filter-pill.active,
    .category-chip.active,
    .primary-btn {
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, white 6%), color-mix(in srgb, var(--accent) 72%, black 12%));
      color: #071117;
      border: 1px solid transparent;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .proposal-panel[data-level="l1"] .filter-pill.active,
    .proposal-panel[data-level="l2"] .filter-pill.active,
    .proposal-panel[data-level="l1"] .category-chip.active,
    .proposal-panel[data-level="l2"] .category-chip.active,
    .proposal-panel[data-level="l1"] .primary-btn,
    .proposal-panel[data-level="l2"] .primary-btn {
      color: #032118;
    }
    .status-yes { background: rgba(0,230,118,.12); border-color: rgba(0,230,118,.2); color: #7df9bf; }
    .status-no { background: rgba(244,67,54,.12); border-color: rgba(244,67,54,.2); color: #ffaea7; }
    .radio-list { display: flex; flex-direction: column; gap: 8px; }
    .radio-item {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(255,255,255,.03);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .radio-item.active { background: rgba(0,230,118,.12); border-color: rgba(0,230,118,.18); color: #bcffe0; }
    .proposal-panel[data-level="l3"] .radio-item.active { background: rgba(245,164,42,.12); border-color: rgba(245,164,42,.22); color: #ffd7a1; }
    .proposal-panel[data-level="l4"] .radio-item.active { background: rgba(45,212,191,.12); border-color: rgba(45,212,191,.22); color: #b9fff6; }
    .legend-stack { display: flex; flex-direction: column; gap: 8px; }
    .legend-row { display: grid; grid-template-columns: 72px 1fr; gap: 8px; align-items: center; }
    .legend-name { font-size: 13px; color: var(--muted); }
    .legend-bar,
    .status-pill {
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      color: #081016;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .legend-bar { width: 100%; justify-content: flex-start; }
    .state-draft { background: var(--state-draft); }
    .state-tentative { background: var(--state-tentative); }
    .state-confirmed { background: var(--state-confirmed); }
    .state-running { background: var(--state-running); }
    .state-completed { background: var(--state-completed); }
    .state-error { background: var(--state-error); }
    .proposal-panel[data-level="l3"] .legend-bar,
    .proposal-panel[data-level="l3"] .status-pill,
    .proposal-panel[data-level="l4"] .legend-bar,
    .proposal-panel[data-level="l4"] .status-pill {
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 8px 18px rgba(0,0,0,.2);
    }
    .error-banner {
      padding: 12px 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(244,67,54,.16), rgba(251,146,60,.1));
      border: 1px solid rgba(251,146,60,.24);
      color: #ffd0c9;
      font-size: 13px;

    function buildTabs() {
      document.getElementById('pageTabs').innerHTML = pages.map(page => `<button class="tab-btn page-tab" data-page="${page.key}" onclick="show('${page.key}', currentLevel)">${page.label}</button>`).join('');
      document.getElementById('levelTabs').innerHTML = levels.map(level => `<button class="tab-btn level-tab" data-level="${level.key}" onclick="show(currentPage, '${level.key}')"><span class="level-dot" style="background:${level.dot}; color:${level.dot}"></span>${level.key.toUpperCase()} ${level.label}</button>`).join('');
    }

    function buildPanels() {
      document.getElementById('viewer').innerHTML = pages.map(page => levels.map(level => renderPanel(page.key, level.key)).join('')).join('');
    }

    let currentPage = 'job-view';
    let currentLevel = 'l1';

    function animateCount(el, delay) {
      const target = Number(el.dataset.count || 0);
      const decimals = Number(el.dataset.decimals || 0);
      const duration = 1000;
      setTimeout(() => {
        const start = performance.now();
        function frame(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          el.textContent = (target * eased).toFixed(decimals);
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }, delay);
    }

    function animatePanel(panel) {
      if (!panel) return;
      panel.classList.remove('animate');
      panel.querySelectorAll('.stagger').forEach((el, index) => { el.style.transitionDelay = `${index * 65}ms`; });
      panel.querySelectorAll('.countup').forEach(el => { el.textContent = Number(el.dataset.decimals || 0) > 0 ? (0).toFixed(Number(el.dataset.decimals || 0)) : '0'; });
      panel.querySelectorAll('.width-anim').forEach(el => { el.style.width = '0'; });
      requestAnimationFrame(() => {
        panel.classList.add('animate');
        panel.querySelectorAll('.countup').forEach((el, index) => animateCount(el, index * 80));
        panel.querySelectorAll('.width-anim').forEach((el, index) => setTimeout(() => { el.style.width = el.dataset.width; }, index * 80));
      });
    }

    function show(page, level) {
      currentPage = page;
      currentLevel = level;
      document.querySelectorAll('.proposal-panel').forEach(panel => panel.classList.remove('active'));
      document.querySelectorAll('.page-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.page === page));
      document.querySelectorAll('.level-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.level === level));
      const panel = document.getElementById(`${page}-${level}`);
      if (panel) {
        panel.classList.add('active');
        document.getElementById('viewer').scrollTop = 0;
        animatePanel(panel);
      }
    }

    buildTabs();
    buildPanels();
    show('job-view', 'l1');
    window.show = show;
